// 独立初始化脚本，避免修改共享 build.gradle；不启动服务端或访问数据库。
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('questAdjustDryRun', JavaExec) {
        dependsOn root.tasks.named('classes')
        classpath = root.sourceSets.main.runtimeClasspath
        mainClass = 'emu.grasscutter.game.quest.adjust.QuestAdjustDryRun'
        workingDir root.projectDir
        maxHeapSize = '4G'
        doFirst {
            ['input', 'goal', 'out'].each { name ->
                if (!root.hasProperty(name)) throw new GradleException("缺少 -P${name}=...")
            }
            args root.property('input'), root.property('goal'), root.property('out')
        }
    }
}
